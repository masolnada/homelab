services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest@sha256:5f261f6ca5505fbe4ba0bc30cc615a4d3925c99ad6ae686411e43cf32135bb5d
    container_name: cli-proxy-api
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
    networks:
      - proxy_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  cpa-manager-plus:
    image: seakee/cpa-manager-plus:latest@sha256:a4ae26a1160b61749aee4537d50edd763ff6d6ba3a1d5dfee7b71952e5e928e1
    container_name: cpa-manager-plus
    restart: unless-stopped
    depends_on:
      - cli-proxy-api
    environment:
      - TZ=${TIMEZONE}
      - HTTP_ADDR=0.0.0.0:18317
      - USAGE_DB_PATH=/data/usage.sqlite
      - CPA_MANAGER_DATA_KEY_PATH=/data/data.key
      - CPA_MANAGER_ADMIN_KEY=${CPA_MANAGER_ADMIN_KEY}
      - CPA_UPSTREAM_URL=http://cli-proxy-api:8317
      - CPA_MANAGEMENT_KEY=${CPA_MANAGEMENT_KEY}
      - USAGE_COLLECTOR_MODE=auto
      - USAGE_BATCH_SIZE=100
      - USAGE_POLL_INTERVAL_MS=500
      - USAGE_QUERY_LIMIT=50000
    volumes:
      - ./manager:/data
    networks:
      - proxy_net
    labels:
      - docker-volume-backup.stop-during-backup=cpa
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18317/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  backup:
    image: offen/docker-volume-backup:latest@sha256:8eaf987d83e7b5f7c4edd8d177c2ca74b49a0d015d241e99a260c19a043b46aa
    container_name: cpa-backup
    restart: unless-stopped
    environment:
      - BACKUP_CRON_EXPRESSION=0 3 * * *
      - BACKUP_RETENTION_DAYS=30
      - BACKUP_FILENAME=cpa-%Y-%m-%dT%H-%M-%S.tar.gz
      - BACKUP_ARCHIVE=/archive/cpa
      - BACKUP_STOP_DURING_BACKUP_LABEL=cpa
      - TZ=${TIMEZONE}
    volumes:
      - ./auths:/backup/cpa-auths:ro
      - ./manager:/backup/cpa-manager-plus:ro
      - ./keeper:/backup/cpa-usage-keeper-legacy:ro
      - nas_backup:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    networks:
      - proxy_net

volumes:
  nas_backup:
    driver: local
    driver_opts:
      type: cifs
      device: //${NAS_IP}/${NAS_BACKUP_SHARE}
      o: addr=${NAS_IP},username=${NAS_BACKUP_USER},password=${NAS_BACKUP_PASSWORD},file_mode=0700,dir_mode=0700

networks:
  proxy_net:
    external: true
