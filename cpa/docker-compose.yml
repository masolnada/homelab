services:
  9router:
    image: decolua/9router:latest@sha256:4316fefb95ea642d57db885d906b1227b1768b15ac5def314621fd781da7b3f1
    container_name: 9router
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - JWT_SECRET=${NINEROUTER_JWT_SECRET}
      - INITIAL_PASSWORD=${NINEROUTER_INITIAL_PASSWORD}
      - HEADROOM_URL=http://headroom:8787
    volumes:
      - ./9router:/app/data
    depends_on:
      - headroom
    networks:
      - proxy_net
    labels:
      - docker-volume-backup.stop-during-backup=cpa
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # RTK token saver for 9router: compresses tool_result payloads before they
  # reach the upstream provider. Enable in 9router: Endpoint -> Token Saver.
  headroom:
    image: ghcr.io/chopratejas/headroom:latest@sha256:50b85d8e320cfcdf1b38919bb7ae067b93ff7a8de0a93f05b2c1246370200d1c
    container_name: headroom
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
    # Savings history (proxy_savings.json) — without this the dashboard resets
    # to zero on every container recreate.
    volumes:
      - ./headroom:/root/.headroom
    networks:
      - proxy_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  nas_backup:
    driver: local
    driver_opts:
      type: cifs
      device: //${NAS_IP}/${NAS_BACKUP_SHARE}
      o: addr=${NAS_IP},username=${NAS_BACKUP_USER},password=${NAS_BACKUP_PASSWORD},file_mode=0700,dir_mode=0700

networks:
  proxy_net:
    external: true
