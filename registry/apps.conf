# Source repositories for locally built app images.
#
# One app per line: <image-name> <git-url>
#
# The image name must match the repository part of the image reference used in
# the stack compose files (localhost:5000/<image-name>:<tag>), and the tag must
# be a git ref (tag, branch, or commit) in that repository. deploy.sh reads the
# compose files to learn which tags are required, and builds only the ones the
# registry does not have yet.
#
# Lines starting with # and blank lines are ignored.

nolimit-cardona-monitor https://github.com/masolnada/nolimit-cardona-monitor.git
