# Fertigation controller (KC868-A8) flow sensor. ESPHome publishes bare numeric
# payloads to <device>/sensor/<entity>/state, so this uses the value parser as a
# float rather than the JSON parser used for zigbee/shelly. Reuses the main
# config's influxdb_v2 output (merged via --config-directory).
# Fertigation moved to its own broker on the hort VM (10.0.20.150, VLAN 20).
# Homelab keeps only this read-only observability tap; the control path no
# longer touches the homelab broker.
[[inputs.mqtt_consumer]]
  name_override = "esphome_sensor"
  servers = ["tcp://10.0.20.150:1883"]
  topics = [
    "kc868-a8/sensor/flow_rate/state",
    "kc868-a8/sensor/total_water/state",
  ]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  client_id = "telegraf-esphome-sensor"
  qos = 0
  topic_tag = ""
  data_format = "value"
  data_type = "float"

  # kc868-a8/sensor/flow_rate/state
  #   → tags: device=kc868-a8, entity=flow_rate
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/+/+"
    tags = "device//entity/"

# MQTT-originated device events and availability only. `topic` preserves the
# source so Grafana can apply its warning/error severity mapping.
[[inputs.mqtt_consumer]]
  name_override = "esphome_event"
  servers = ["tcp://10.0.20.150:1883"]
  topics = [
    "kc868-a8/flow/dry_run",
    "kc868-a8/flow/reset_total/result",
    "kc868-a8/status",
  ]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  client_id = "telegraf-esphome-event"
  qos = 0
  topic_tag = "topic"
  data_format = "value"
  data_type = "string"
