ui:
  default-sort-by: group

# Device notifications are aggregated by home-device-digest.timer at 08:00 Europe/Madrid.
default-home-device: &home-device
  group: Temperature sensors
  url: http://influxdb:8086/api/v2/query?org=${INFLUXDB_ORG}
  method: POST
  interval: 5m
  headers:
    Authorization: "Token ${GATUS_INFLUXDB_TOKEN}"
    Content-Type: application/vnd.flux
    Accept: application/csv
  body: |
    from(bucket: "${INFLUXDB_BUCKET}")
      |> range(start: -3h)
      |> filter(fn: (r) => (r._measurement == "zigbee" or r._measurement == "esphome_heartbeat" or r._measurement == "shelly_em") and r.device == "[ENDPOINT_NAME]")
      |> last()
      |> map(fn: (r) => ({r with _value: "home_device_reporting"}))
      |> keep(columns: ["_time", "_value"])
  conditions:
    - "[STATUS] == 200"
    - "[BODY] == pat(*home_device_reporting*)"

endpoints:
  - name: shellypro3em-34987a44fb48
    <<: *home-device
    group: Energy meters

  - name: entrance-button
    <<: *home-device
