services:
  home-agent:
    profiles: [home-agent]
    image: localhost:5000/home-agent:7122b9534b1190f7102f6e9b094a2754e3d92227
    container_name: home-agent
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
      - PI_OFFLINE=1
      - HOME_AGENT_REPO_DIR=/data/repo
      - PI_CODING_AGENT_DIR=/data/pi-agent
      - PI_CODING_AGENT_SESSION_DIR=/data/sessions
      - HOME_AGENT_STATE_DIR=/data/state
      - TELEGRAM_BOT_TOKEN=${HOME_AGENT_TELEGRAM_BOT_TOKEN}
      - TELEGRAM_USER_ID=${HOME_AGENT_TELEGRAM_USER_ID}
      - TELEGRAM_CHAT_ID=${HOME_AGENT_TELEGRAM_CHAT_ID}
      - NINEROUTER_API_KEY=${HOME_AGENT_NINEROUTER_API_KEY}
      - PI_MODEL_PROVIDER=9router
      - PI_MODEL_ID=${HOME_AGENT_PI_MODEL_ID}
      - PI_THINKING_LEVEL=${HOME_AGENT_PI_THINKING_LEVEL:-high}
      - MQTT_URL=mqtt://mosquitto:1883
      - MQTT_USERNAME=${HOME_AGENT_MQTT_USERNAME}
      - MQTT_PASSWORD=${HOME_AGENT_MQTT_PASSWORD}
      - REPO_URL=git@github.com:masolnada/my-esphome.git
      - GIT_DEPLOY_KEY_B64=${HOME_AGENT_GIT_DEPLOY_KEY_B64}
      - GIT_AUTHOR_NAME=Home Agent
      - GIT_AUTHOR_EMAIL=home-agent@local
    volumes:
      - home_agent_repo:/data/repo
      - home_agent_pi:/data/pi-agent
      - home_agent_sessions:/data/sessions
      - home_agent_state:/data/state
    networks:
      - proxy_net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  agent-inbox:
    image: localhost:5000/milverds-agent-inbox:fcbe7f3759d2a75a87f3db0dc7760f2c2a628b0e
    container_name: agent-inbox
    restart: unless-stopped
    environment:
      - PORT=8080
      - SPOOL_DIR=/var/lib/agent-inbox
      - INGEST_TOKEN=${AGENT_INBOX_INGEST_TOKEN}
      - INBOX_ADDRESS=${AGENT_INBOX_INBOX_ADDRESS}
      - AUTHORIZED_SENDER=${AGENT_INBOX_AUTHORIZED_SENDER}
      - DKIM_DOMAIN=${AGENT_INBOX_DKIM_DOMAIN}
      - MAX_RAW_BYTES=26214400
      - MAX_INPUT_CHARS=100000
    volumes:
      - agent_inbox_spool:/var/lib/agent-inbox
    networks:
      - milverds_net

  # Own tunnel and own network. The token can publish only to agent-inbox, and
  # agent-inbox — which parses untrusted email and PDFs — cannot reach
  # Vaultwarden, the Docker socket proxy or any other proxy_net service.
  cloudflared-milverds:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-milverds
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${MILVERDS_TUNNEL_TOKEN}
    networks:
      - milverds_net

  backup:
    image: offen/docker-volume-backup:latest@sha256:26df48fdb7bd32f114fc7420beae3960055ae1f40ba5ff3bfd787cb5f15fefa5
    container_name: agent-backup
    restart: unless-stopped
    environment:
      - BACKUP_CRON_EXPRESSION=0 3 * * *
      - BACKUP_RETENTION_DAYS=30
      - BACKUP_FILENAME=agent-%Y-%m-%dT%H-%M-%S.tar.gz
      - BACKUP_ARCHIVE=/archive/agent
      - TZ=${TIMEZONE}
    volumes:
      - home_agent_pi:/backup/home_agent_pi:ro
      - home_agent_sessions:/backup/home_agent_sessions:ro
      - home_agent_state:/backup/home_agent_state:ro
      - nas_backup:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    networks:
      - proxy_net

volumes:
  agent_inbox_spool:
    name: agent_inbox_spool
  home_agent_repo:
  home_agent_pi:
  home_agent_sessions:
  home_agent_state:
  nas_backup:
    driver: local
    driver_opts:
      type: cifs
      device: //${NAS_IP}/${NAS_BACKUP_SHARE}
      o: addr=${NAS_IP},username=${NAS_BACKUP_USER},password=${NAS_BACKUP_PASSWORD},file_mode=0700,dir_mode=0700

networks:
  proxy_net:
    external: true
  milverds_net:
    name: milverds_net
